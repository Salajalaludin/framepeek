name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            constraints: "-c tests/constraints-min.txt"
            artifact-constraints: "--constraints tests/constraints-min.txt"
          - python-version: "3.14"
            constraints: ""
            artifact-constraints: ""

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,release]" ${{ matrix.constraints }}
      - run: python -m ruff check .
      - run: python -m mypy src/framepeek
      - run: >-
          python -m pytest
          --cov=framepeek
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=100
      - run: python -m build --outdir dist/ci
      - run: python -m twine check --strict dist/ci/*
      - run: python scripts/verify_artifacts.py dist/ci ${{ matrix.artifact-constraints }}
