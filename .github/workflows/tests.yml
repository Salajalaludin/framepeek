name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: >-
          python -m pytest
          --cov=framepeek
          --cov-report=term-missing
          --cov-fail-under=100
      - run: python -m pip wheel . --no-deps --wheel-dir dist
      - run: >-
          python -c "from pathlib import Path; from zipfile import ZipFile;
          wheel=next(Path('dist').glob('framepeek-*.whl'));
          assert 'framepeek/py.typed' in ZipFile(wheel).namelist()"
      - run: python -m pip uninstall -y framepeek
      - run: python -m pip install --no-deps dist/framepeek-*.whl
      - run: python -c "import framepeek; assert framepeek.__version__"
      - run: python -m mypy --no-incremental tests/typecheck_consumer.py
