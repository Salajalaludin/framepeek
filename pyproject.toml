[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framepeek"
version = "0.1.0"
description = "Lightweight exploratory data analysis for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sal" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
