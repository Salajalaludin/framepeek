[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framepeek"
version = "0.1.0"
description = "Lightweight exploratory data analysis for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sal" }]
dependencies = [
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pandas-stubs>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]
release = [
    "build>=1.2",
    "twine>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
warn_unused_configs = true
